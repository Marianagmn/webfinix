<div class="layout-wrapper" [class.sidebar-collapsed]="!sidebarOpen()">

  <!-- Mobile overlay: tap outside sidebar to close -->
  @if (sidebarOpen()) {
    <div class="sidebar-overlay" (click)="closeSidebar()" aria-hidden="true"></div>
  }


  <aside class="sidebar">
    <div class="sidebar-header">
      <a class="sidebar-brand" routerLink="/dashboard">
        <div class="brand-logo">
          <i class="bi bi-graph-up-arrow"></i>
        </div>
        <div class="brand-text">
          <span class="brand-name">Finix</span>
          <span class="brand-sub">Finance Platform</span>
        </div>
      </a>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
      <a routerLink="/accounts" routerLinkActive="active" class="nav-link">
        <i class="bi bi-wallet2"></i>
        <span>Cuentas</span>
      </a>
      <a routerLink="/categories" routerLinkActive="active" class="nav-link">
        <i class="bi bi-tags"></i>
        <span>Categorías</span>
      </a>

      <span class="nav-section-label">Finanzas</span>

      <a routerLink="/personal-finance" routerLinkActive="active" class="nav-link">
        <i class="bi bi-graph-up"></i>
        <span>Personal</span>
      </a>
      <a routerLink="/business-finance" routerLinkActive="active" class="nav-link">
        <i class="bi bi-building"></i>
        <span>Negocio</span>
      </a>

      <span class="nav-section-label">Cuenta</span>

      <a routerLink="/user/profile" routerLinkActive="active" class="nav-link">
        <i class="bi bi-person-circle"></i>
        <span>Perfil</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" type="button" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <button class="btn-toggle-sidebar" type="button" (click)="toggleSidebar()" aria-label="Alternar menú lateral">
        <i class="bi bi-list"></i>
      </button>

      <div class="topbar-right">
        @if (authStore.user()) {
          <a routerLink="/user/profile" class="user-pill">
            <div class="user-avatar">
              {{ authStore.user()?.name?.charAt(0)?.toUpperCase() ?? 'U' }}
            </div>
            <div>
              <div class="user-name">{{ authStore.user()?.name }}</div>
              <div class="user-role">{{ authStore.user()?.roles?.[0] }}</div>
            </div>
          </a>
        }
      </div>
    </header>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
