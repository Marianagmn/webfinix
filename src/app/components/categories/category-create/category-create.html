<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-5">
      <div class="d-flex align-items-center gap-3 mb-4">
        <a routerLink="/categories" class="btn btn-outline-secondary btn-sm">← Volver</a>
        <h2 class="h4 mb-0 fw-semibold">Nueva Categoría</h2>
      </div>
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-medium">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="nombre" placeholder="Ej: Alimentación"
                [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched">
              <div class="invalid-feedback">El nombre es requerido.</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-medium">Tipo <span class="text-danger">*</span></label>
              <select class="form-select" formControlName="tipo">
                @for (t of tipos; track t) { <option [value]="t">{{ t | titlecase }}</option> }
              </select>
            </div>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label fw-medium">Color</label>
                <input type="color" class="form-control form-control-color w-100" formControlName="color">
              </div>
              <div class="col-6">
                <label class="form-label fw-medium">Ícono (emoji)</label>
                <input type="text" class="form-control" formControlName="icono" placeholder="Ej: 🍔" maxlength="4">
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
              <a routerLink="/categories" class="btn btn-outline-secondary">Cancelar</a>
              <button type="submit" class="btn btn-primary" [disabled]="loading()">
                @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Crear Categoría
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
