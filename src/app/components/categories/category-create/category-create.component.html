<div class="container-fluid py-2">
  <div class="d-flex align-items-center mb-4">
    <a routerLink="/categories" class="btn btn-outline-secondary btn-sm me-3">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h2 class="fw-bold m-0">Nueva Categoría</h2>
  </div>

  <div class="card shadow-sm border-0" style="max-width: 600px;">
    <div class="card-body p-4">
      <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Nombre de la categoría</label>
          <input type="text" class="form-control" formControlName="nombre" placeholder="Ej. Alimentación"
                 [ngClass]="{'is-invalid': categoryForm.get('nombre')?.invalid && categoryForm.get('nombre')?.touched}">
          <div class="invalid-feedback">El nombre es requerido.</div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Tipo de categoría</label>
            <select class="form-select" formControlName="tipo">
              <option value="expense">Gasto</option>
              <option value="income">Ingreso</option>
              <option value="transfer">Transferencia</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Color representativo</label>
            <input type="color" class="form-control form-control-color w-100" formControlName="color" title="Elige un color">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label d-block">Ícono</label>
          <div class="d-flex flex-wrap gap-2">
            <div *ngFor="let icon of availableIcons" class="form-check form-check-inline m-0">
              <input class="btn-check" type="radio" formControlName="icono" [value]="icon" [id]="'icon-' + icon">
              <label class="btn btn-outline-secondary p-2 d-flex justify-content-center align-items-center" [for]="'icon-' + icon" style="width: 45px; height: 45px;">
                <i class="bi bi-{{icon}} fs-5"></i>
              </label>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <button type="button" class="btn btn-light me-2" routerLink="/categories">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            Crear Categoría
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
