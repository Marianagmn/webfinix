<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-0 pt-4">
          <h4 class="fw-bold m-0">Mi Perfil</h4>
        </div>
        <div class="card-body">
          @if (businessRequiredMessage()) {
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
              {{ businessRequiredMessage() }}
              <button type="button" class="btn-close" (click)="businessRequiredMessage.set(null)"></button>
            </div>
          }
          <div *ngIf="isLoading" class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <form *ngIf="!isLoading" [formGroup]="profileForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="name" class="form-label">Nombre</label>
              <input
                type="text"
                class="form-control"
                id="name"
                formControlName="name"
                [class.is-invalid]="profileForm.get('name')?.touched && profileForm.get('name')?.invalid"
              />
              <div class="invalid-feedback" *ngIf="profileForm.get('name')?.touched && profileForm.get('name')?.errors?.['required']">
                El nombre es requerido
              </div>
              <div class="invalid-feedback" *ngIf="profileForm.get('name')?.touched && profileForm.get('name')?.errors?.['minlength']">
                El nombre debe tener al menos 2 caracteres
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                formControlName="email"
                [class.is-invalid]="profileForm.get('email')?.touched && profileForm.get('email')?.invalid"
              />
              <div class="invalid-feedback" *ngIf="profileForm.get('email')?.touched && profileForm.get('email')?.errors?.['required']">
                El email es requerido
              </div>
              <div class="invalid-feedback" *ngIf="profileForm.get('email')?.touched && profileForm.get('email')?.errors?.['email']">
                Email inválido
              </div>
            </div>

            <div class="mb-3">
              <label for="businessId" class="form-label">ID de Negocio (Business Finance)</label>
              <input
                type="text"
                class="form-control"
                id="businessId"
                formControlName="businessId"
                placeholder="Ingresa tu ID de negocio para acceder a finanzas empresariales"
              />
              <small class="text-muted">
                Si tienes un negocio, ingresa su ID aquí para habilitar el módulo de finanzas empresariales.
              </small>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
                <span *ngIf="!isSaving()">Guardar</span>
                <span *ngIf="isSaving()" class="spinner-border spinner-border-sm"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
