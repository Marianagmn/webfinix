<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-0 pt-4">
          <h4 class="fw-bold m-0">Cambiar Contraseña</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="currentPassword" class="form-label">Contraseña Actual</label>
              <input
                type="password"
                class="form-control"
                id="currentPassword"
                formControlName="currentPassword"
                [class.is-invalid]="passwordForm.get('currentPassword')?.touched && passwordForm.get('currentPassword')?.invalid"
              />
              <div class="invalid-feedback" *ngIf="passwordForm.get('currentPassword')?.touched && passwordForm.get('currentPassword')?.errors?.['required']">
                La contraseña actual es requerida
              </div>
            </div>

            <div class="mb-3">
              <label for="newPassword" class="form-label">Nueva Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="newPassword"
                formControlName="newPassword"
                [class.is-invalid]="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid"
              />
              <div class="invalid-feedback" *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.errors?.['required']">
                La nueva contraseña es requerida
              </div>
              <div class="invalid-feedback" *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.errors?.['minlength']">
                La contraseña debe tener al menos 6 caracteres
              </div>
            </div>

            <div class="mb-3">
              <label for="passwordConfirm" class="form-label">Confirmar Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="passwordConfirm"
                formControlName="passwordConfirm"
                [class.is-invalid]="passwordForm.get('passwordConfirm')?.touched && (passwordForm.get('passwordConfirm')?.invalid || passwordForm.errors?.['passwordMismatch'])"
              />
              <div class="invalid-feedback" *ngIf="passwordForm.get('passwordConfirm')?.touched && passwordForm.get('passwordConfirm')?.errors?.['required']">
                Confirmar contraseña es requerida
              </div>
              <div class="invalid-feedback" *ngIf="passwordForm.errors?.['passwordMismatch']">
                Las contraseñas no coinciden
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
                <span *ngIf="!isSaving()">Cambiar Contraseña</span>
                <span *ngIf="isSaving()" class="spinner-border spinner-border-sm"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
