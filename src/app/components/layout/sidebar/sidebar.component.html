<div class="bg-white border-end h-100 py-3 d-flex flex-column" [class.collapsed]="isCollapsed()" style="width: 250px; min-height: calc(100vh - 56px); transition: width 0.3s ease;">
  <button class="btn btn-link text-muted ms-auto mb-2" (click)="toggleCollapse()" style="width: fit-content;">
    <i class="bi" [class.bi-chevron-left]="!isCollapsed()" [class.bi-chevron-right]="isCollapsed()"></i>
  </button>
  
  <div class="list-group list-group-flush flex-grow-1">
    <a routerLink="/dashboard" routerLinkActive="active bg-primary text-white" [routerLinkActiveOptions]="{exact: true}" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-grid-1x2" [class.me-2]="!isCollapsed()"></i>
      @if (!isCollapsed()) { Dashboard }
    </a>
    <a routerLink="/accounts" routerLinkActive="active bg-primary text-white" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-bank" [class.me-2]="!isCollapsed()"></i>
      @if (!isCollapsed()) { Cuentas }
    </a>
    <a routerLink="/categories" routerLinkActive="active bg-primary text-white" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-tags" [class.me-2]="!isCollapsed()"></i>
      @if (!isCollapsed()) { Categorías }
    </a>
    <a routerLink="/transactions" routerLinkActive="active bg-primary text-white" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-cash-coin" [class.me-2]="!isCollapsed()"></i>
      @if (!isCollapsed()) { Finanzas Personales }
    </a>
    <a routerLink="/business" routerLinkActive="active bg-primary text-white" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-briefcase" [class.me-2]="!isCollapsed()"></i>
      @if (!isCollapsed()) { Finanzas Empresariales }
    </a>
  </div>
</div>
