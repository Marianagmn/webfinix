<div class="bg-white border-end h-100 py-3" style="width: 250px; min-height: calc(100vh - 56px);">
  <div class="list-group list-group-flush">
    <a routerLink="/dashboard" routerLinkActive="active bg-primary text-white" [routerLinkActiveOptions]="{exact: true}" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-grid-1x2 me-2"></i> Dashboard
    </a>
    <a routerLink="/accounts" routerLinkActive="active bg-primary text-white" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-bank me-2"></i> Cuentas
    </a>
    <a routerLink="/categories" routerLinkActive="active bg-primary text-white" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-tags me-2"></i> Categorías
    </a>
    <a routerLink="/transactions" routerLinkActive="active bg-primary text-white" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-cash-coin me-2"></i> Finanzas Personales
    </a>
    <a routerLink="/business" routerLinkActive="active bg-primary text-white" class="list-group-item list-group-item-action border-0 py-3">
      <i class="bi bi-briefcase me-2"></i> Finanzas Empresariales
    </a>
  </div>
</div>
