<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-0 pt-4">
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="fw-bold m-0">Editar Transacción</h4>
            <a routerLink="/transactions" class="btn btn-outline-secondary btn-sm">Cancelar</a>
          </div>
        </div>
        <div class="card-body">
          <div *ngIf="isLoading" class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <form *ngIf="!isLoading" [formGroup]="txnForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select
                  class="form-select"
                  id="tipo"
                  formControlName="tipo"
                  [class.is-invalid]="txnForm.get('tipo')?.touched && txnForm.get('tipo')?.invalid"
                >
                  <option value="ingreso">Ingreso</option>
                  <option value="gasto">Gasto</option>
                  <option value="transferencia">Transferencia</option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label for="monto" class="form-label">Monto</label>
                <input
                  type="number"
                  class="form-control"
                  id="monto"
                  formControlName="monto"
                  step="0.01"
                  min="0.01"
                  [class.is-invalid]="txnForm.get('monto')?.touched && txnForm.get('monto')?.invalid"
                />
                <div class="invalid-feedback" *ngIf="txnForm.get('monto')?.touched && txnForm.get('monto')?.errors?.['required']">
                  El monto es requerido
                </div>
                <div class="invalid-feedback" *ngIf="txnForm.get('monto')?.touched && txnForm.get('monto')?.errors?.['min']">
                  El monto debe ser mayor a 0
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="categoria" class="form-label">Categoría</label>
                <select
                  class="form-select"
                  id="categoria"
                  formControlName="categoria"
                  [class.is-invalid]="txnForm.get('categoria')?.touched && txnForm.get('categoria')?.invalid"
                >
                  <option value="">Seleccionar categoría</option>
                  <option *ngIf="categories().length === 0" disabled value="">No hay categorías — crea una primero</option>
                  <option *ngFor="let cat of categories()" [value]="cat.id">{{ cat.nombre }}</option>
                </select>
                <div class="invalid-feedback" *ngIf="txnForm.get('categoria')?.touched && txnForm.get('categoria')?.errors?.['required']">
                  La categoría es requerida
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="cuentaOrigenId" class="form-label">Cuenta</label>
                <select
                  class="form-select"
                  id="cuentaOrigenId"
                  formControlName="cuentaOrigenId"
                >
                  <option value="">Seleccionar cuenta</option>
                  <option *ngIf="accounts().length === 0" disabled value="">No hay cuentas — crea una primero</option>
                  <option *ngFor="let acc of accounts()" [value]="acc.id">{{ acc.nombre }}</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="fecha" class="form-label">Fecha</label>
                <input
                  type="date"
                  class="form-control"
                  id="fecha"
                  formControlName="fecha"
                  [class.is-invalid]="txnForm.get('fecha')?.touched && txnForm.get('fecha')?.invalid"
                />
                <div class="invalid-feedback" *ngIf="txnForm.get('fecha')?.touched && txnForm.get('fecha')?.errors?.['required']">
                  La fecha es requerida
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="metodoPago" class="form-label">Método de pago</label>
                <select
                  class="form-select"
                  id="metodoPago"
                  formControlName="metodoPago"
                >
                  <option value="efectivo">Efectivo</option>
                  <option value="transferencia">Transferencia</option>
                  <option value="tarjeta de credito">Tarjeta de crédito</option>
                  <option value="tarjeta debito">Tarjeta débito</option>
                  <option value="cheque">Cheque</option>
                  <option value="otro">Otro</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="tags" class="form-label">Etiquetas (separadas por coma)</label>
                <input
                  type="text"
                  class="form-control"
                  id="tags"
                  formControlName="tags"
                  placeholder="ej: comida, hogar"
                />
              </div>

              <div class="col-md-6 mb-3">
                <label for="moneda" class="form-label">Moneda</label>
                <select
                  class="form-select"
                  id="moneda"
                  formControlName="moneda"
                >
                  <option value="COP">COP</option>
                  <option value="USD">USD</option>
                  <option value="EUR">EUR</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="descripcion" class="form-label">Descripción</label>
              <textarea
                class="form-control"
                id="descripcion"
                formControlName="descripcion"
                rows="3"
              ></textarea>
            </div>

            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="esAhorro"
                formControlName="esAhorro"
              />
              <label class="form-check-label" for="esAhorro">
                Es ahorro
              </label>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
                <span *ngIf="!isSaving()">Guardar Cambios</span>
                <span *ngIf="isSaving()" class="spinner-border spinner-border-sm"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
