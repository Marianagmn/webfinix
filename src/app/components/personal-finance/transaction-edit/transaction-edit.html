<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-0 pt-4">
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="fw-bold m-0">Editar Transacción</h4>
            <a routerLink="/transactions" class="btn btn-outline-secondary btn-sm">Cancelar</a>
          </div>
        </div>
        <div class="card-body">
          <div *ngIf="isLoading" class="text-center p-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <form *ngIf="!isLoading" [formGroup]="txnForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="type" class="form-label">Tipo</label>
                <select
                  class="form-select"
                  id="type"
                  formControlName="type"
                  [class.is-invalid]="txnForm.get('type')?.touched && txnForm.get('type')?.invalid"
                >
                  <option value="ingreso">Ingreso</option>
                  <option value="gasto">Gasto</option>
                  <option value="transferencia">Transferencia</option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label for="amount" class="form-label">Monto</label>
                <input
                  type="number"
                  class="form-control"
                  id="amount"
                  formControlName="amount"
                  step="0.01"
                  min="0.01"
                  [class.is-invalid]="txnForm.get('amount')?.touched && txnForm.get('amount')?.invalid"
                />
                <div class="invalid-feedback" *ngIf="txnForm.get('amount')?.touched && txnForm.get('amount')?.errors?.['required']">
                  El monto es requerido
                </div>
                <div class="invalid-feedback" *ngIf="txnForm.get('amount')?.touched && txnForm.get('amount')?.errors?.['min']">
                  El monto debe ser mayor a 0
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="categoryId" class="form-label">Categoría</label>
                <select
                  class="form-select"
                  id="categoryId"
                  formControlName="categoriaId"
                  [class.is-invalid]="txnForm.get('categoriaId')?.touched && txnForm.get('categoriaId')?.invalid"
                >
                  <option value="">Seleccionar categoría</option>
                  <option *ngIf="categories().length === 0" disabled value="">No hay categorías — crea una primero</option>
                  <option *ngFor="let cat of categories()" [value]="cat.id">{{ cat.nombre }}</option>
                </select>
                <div class="invalid-feedback" *ngIf="txnForm.get('categoriaId')?.touched && txnForm.get('categoriaId')?.errors?.['required']">
                  La categoría es requerida
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="accountId" class="form-label">Cuenta</label>
                <select
                  class="form-select"
                  id="accountId"
                  formControlName="cuentaOrigenId"
                  [class.is-invalid]="txnForm.get('cuentaOrigenId')?.touched && txnForm.get('cuentaOrigenId')?.invalid"
                >
                  <option value="">Seleccionar cuenta</option>
                  <option *ngIf="accounts().length === 0" disabled value="">No hay cuentas — crea una primero</option>
                  <option *ngFor="let acc of accounts()" [value]="acc.id">{{ acc.nombre }}</option>
                </select>
                <div class="invalid-feedback" *ngIf="txnForm.get('cuentaOrigenId')?.touched && txnForm.get('cuentaOrigenId')?.errors?.['required']">
                  La cuenta es requerida
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="date" class="form-label">Fecha</label>
                <input
                  type="date"
                  class="form-control"
                  id="date"
                  formControlName="date"
                  [class.is-invalid]="txnForm.get('date')?.touched && txnForm.get('date')?.invalid"
                />
                <div class="invalid-feedback" *ngIf="txnForm.get('date')?.touched && txnForm.get('date')?.errors?.['required']">
                  La fecha es requerida
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="tags" class="form-label">Etiquetas (separadas por coma)</label>
                <input
                  type="text"
                  class="form-control"
                  id="tags"
                  formControlName="tags"
                  placeholder="ej: comida, hogar"
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Descripción</label>
              <textarea
                class="form-control"
                id="description"
                formControlName="description"
                rows="3"
                [class.is-invalid]="txnForm.get('description')?.touched && txnForm.get('description')?.invalid"
              ></textarea>
              <div class="invalid-feedback" *ngIf="txnForm.get('description')?.touched && txnForm.get('description')?.errors?.['required']">
                La descripción es requerida
              </div>
            </div>

            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="isRecurring"
                formControlName="isRecurring"
              />
              <label class="form-check-label" for="isRecurring">
                Es recurrente
              </label>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
                <span *ngIf="!isSaving()">Guardar Cambios</span>
                <span *ngIf="isSaving()" class="spinner-border spinner-border-sm"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
