<div class="container-fluid py-2">
  <div class="d-flex align-items-center mb-4">
    <a routerLink="/transactions" class="btn btn-outline-secondary btn-sm me-3">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h2 class="fw-bold m-0">Nueva Transacción</h2>
  </div>

  <div class="card shadow-sm border-0" style="max-width: 700px;">
    <div class="card-body p-4">
      <form [formGroup]="txnForm" (ngSubmit)="onSubmit()">
        <!-- Type Selection -->
        <div class="mb-4">
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" formControlName="type" value="expense" id="type-expense">
            <label class="btn btn-outline-danger" for="type-expense">Gasto</label>

            <input type="radio" class="btn-check" formControlName="type" value="income" id="type-income">
            <label class="btn btn-outline-success" for="type-income">Ingreso</label>

            <input type="radio" class="btn-check" formControlName="type" value="transfer" id="type-transfer">
            <label class="btn btn-outline-secondary" for="type-transfer">Transferencia</label>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Monto</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control" formControlName="amount" placeholder="0.00"
                     [ngClass]="{'is-invalid': txnForm.get('amount')?.invalid && txnForm.get('amount')?.touched}">
            </div>
            <div *ngIf="txnForm.get('amount')?.invalid && txnForm.get('amount')?.touched" class="text-danger small mt-1">El monto es requerido.</div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" class="form-control" formControlName="date"
                   [ngClass]="{'is-invalid': txnForm.get('date')?.invalid && txnForm.get('date')?.touched}">
            <div *ngIf="txnForm.get('date')?.invalid && txnForm.get('date')?.touched" class="text-danger small mt-1">La fecha es requerida.</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <input type="text" class="form-control" formControlName="description" placeholder="¿En qué gastaste o de dónde ingresó?"
                 [ngClass]="{'is-invalid': txnForm.get('description')?.invalid && txnForm.get('description')?.touched}">
          <div *ngIf="txnForm.get('description')?.invalid && txnForm.get('description')?.touched" class="text-danger small mt-1">La descripción es requerida.</div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Cuenta</label>
            <select class="form-select" formControlName="accountId"
                    [ngClass]="{'is-invalid': txnForm.get('accountId')?.invalid && txnForm.get('accountId')?.touched}">
              <option value="">Selecciona una cuenta...</option>
              <option *ngFor="let acc of accounts" [value]="acc.id">{{ acc.nombre }} ({{ acc.moneda }})</option>
            </select>
            <div *ngIf="txnForm.get('accountId')?.invalid && txnForm.get('accountId')?.touched" class="text-danger small mt-1">Selecciona una cuenta.</div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Categoría</label>
            <select class="form-select" formControlName="categoryId"
                    [ngClass]="{'is-invalid': txnForm.get('categoryId')?.invalid && txnForm.get('categoryId')?.touched}">
              <option value="">Selecciona una categoría...</option>
              <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.nombre }}</option>
            </select>
            <div *ngIf="txnForm.get('categoryId')?.invalid && txnForm.get('categoryId')?.touched" class="text-danger small mt-1">Selecciona una categoría.</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Etiquetas (Tags)</label>
          <input type="text" class="form-control" formControlName="tags" placeholder="ej. comida, viaje (separados por coma)">
        </div>

        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="isRecurring" formControlName="isRecurring">
          <label class="form-check-label" for="isRecurring">Esta transacción es recurrente (ej. mensualidad)</label>
        </div>

        <div class="d-flex justify-content-end">
          <button type="button" class="btn btn-light me-2" routerLink="/transactions">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            Guardar Transacción
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
