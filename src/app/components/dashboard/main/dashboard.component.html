<div class="container-fluid py-2">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold m-0">Dashboard General</h2>
    <div>
      <button class="btn btn-outline-primary me-2" routerLink="/accounts/create">
        <i class="bi bi-plus-circle me-1"></i> Nueva Cuenta
      </button>
      <button class="btn btn-primary" routerLink="/transactions/create">
        <i class="bi bi-plus me-1"></i> Nueva Transacción
      </button>
    </div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-md-6 col-lg-3">
      <app-stats-card title="Balance Total" [value]="totalBalance" icon="wallet2" color="primary"></app-stats-card>
    </div>
    <div class="col-md-6 col-lg-3">
      <app-stats-card title="Ingresos (Mes)" [value]="incomeMonth" icon="graph-up-arrow" color="success"></app-stats-card>
    </div>
    <div class="col-md-6 col-lg-3">
      <app-stats-card title="Gastos (Mes)" [value]="expenseMonth" icon="graph-down-arrow" color="danger"></app-stats-card>
    </div>
    <div class="col-md-6 col-lg-3">
      <app-stats-card title="Cuentas Activas" [value]="activeAccounts" icon="bank" color="warning"></app-stats-card>
    </div>
  </div>

  <div class="row g-4">
    <!-- Gráfico -->
    <div class="col-lg-5">
      <div class="card shadow-sm h-100 border-0">
        <div class="card-header bg-white border-0 pt-4 pb-0">
          <h5 class="card-title fw-bold">Gastos por Categoría</h5>
        </div>
        <div class="card-body d-flex justify-content-center align-items-center">
          <div style="width: 100%; max-width: 300px;">
            <canvas baseChart
              [data]="pieChartData"
              [type]="pieChartType"
              [options]="pieChartOptions">
            </canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Transacciones Recientes -->
    <div class="col-lg-7">
      <div class="card shadow-sm h-100 border-0">
        <div class="card-header bg-white border-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
          <h5 class="card-title fw-bold m-0">Transacciones Recientes</h5>
          <a routerLink="/transactions" class="text-decoration-none small">Ver todas</a>
        </div>
        <div class="card-body p-0 mt-3">
          <div class="list-group list-group-flush">
            <div *ngFor="let txn of recentTransactions" class="list-group-item d-flex justify-content-between align-items-center py-3">
              <div class="d-flex align-items-center">
                <div class="rounded-circle p-2 me-3 d-flex justify-content-center align-items-center"
                     [ngClass]="{
                       'bg-danger bg-opacity-10 text-danger': txn.type === 'expense',
                       'bg-success bg-opacity-10 text-success': txn.type === 'income',
                       'bg-secondary bg-opacity-10 text-secondary': txn.type === 'transfer'
                     }"
                     style="width: 40px; height: 40px;">
                  <i class="bi" [ngClass]="{
                    'bi-arrow-down-right': txn.type === 'expense',
                    'bi-arrow-up-right': txn.type === 'income',
                    'bi-arrow-left-right': txn.type === 'transfer'
                  }"></i>
                </div>
                <div>
                  <h6 class="mb-0 fw-semibold">{{ txn.description }}</h6>
                  <small class="text-muted">{{ txn.date }}</small>
                </div>
              </div>
              <div class="fw-bold" [ngClass]="{
                'text-danger': txn.type === 'expense',
                'text-success': txn.type === 'income'
              }">
                {{ txn.type === 'expense' ? '-' : (txn.type === 'income' ? '+' : '') }}${{ txn.amount }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
