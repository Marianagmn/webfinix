<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-6">
      <div class="d-flex align-items-center gap-3 mb-4">
        <a routerLink="/accounts" class="btn btn-outline-secondary btn-sm">← Volver</a>
        <h2 class="h4 mb-0 fw-semibold">Nueva Cuenta</h2>
      </div>
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-medium">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="nombre" placeholder="Ej: Cuenta Bancolombia"
                [class.is-invalid]="form.get('nombre')?.invalid && form.get('nombre')?.touched">
              <div class="invalid-feedback">El nombre es requerido (mínimo 2 caracteres).</div>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-medium">Tipo <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="tipo">
                  @for (t of tipos; track t) { <option [value]="t">{{ t | titlecase }}</option> }
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-medium">Moneda <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="moneda">
                  @for (m of monedas; track m) { <option [value]="m">{{ m }}</option> }
                </select>
              </div>
              <div class="col-12">
                <label class="form-label fw-medium">Balance inicial</label>
                <input type="number" class="form-control" formControlName="balance" min="0" step="0.01">
              </div>
              <div class="col-12">
                <label class="form-label fw-medium">Descripción</label>
                <textarea class="form-control" formControlName="descripcion" rows="2" placeholder="Opcional…"></textarea>
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
              <a routerLink="/accounts" class="btn btn-outline-secondary">Cancelar</a>
              <button type="submit" class="btn btn-primary" [disabled]="loading()">
                @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Crear Cuenta
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
