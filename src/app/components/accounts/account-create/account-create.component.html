<div class="container-fluid py-2">
  <div class="d-flex align-items-center mb-4">
    <a routerLink="/accounts" class="btn btn-outline-secondary btn-sm me-3">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h2 class="fw-bold m-0">Nueva Cuenta</h2>
  </div>

  <div class="card shadow-sm border-0" style="max-width: 600px;">
    <div class="card-body p-4">
      <form [formGroup]="accountForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Nombre de la cuenta</label>
          <input type="text" class="form-control" formControlName="nombre" placeholder="Ej. Ahorros Bancolombia"
                 [ngClass]="{'is-invalid': accountForm.get('nombre')?.invalid && accountForm.get('nombre')?.touched}">
          <div class="invalid-feedback">El nombre es requerido.</div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Tipo de cuenta</label>
            <select class="form-select" formControlName="tipo">
              <option value="efectivo">Efectivo</option>
              <option value="ahorro">Ahorro</option>
              <option value="corriente">Corriente</option>
              <option value="credito">Crédito</option>
              <option value="inversion">Inversión</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Moneda</label>
            <select class="form-select" formControlName="moneda">
              <option value="COP">COP - Peso Colombiano</option>
              <option value="USD">USD - Dólar Estadounidense</option>
              <option value="EUR">EUR - Euro</option>
            </select>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Balance Inicial</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" class="form-control" formControlName="balance" placeholder="0.00"
                   [ngClass]="{'is-invalid': accountForm.get('balance')?.invalid && accountForm.get('balance')?.touched}">
            <div class="invalid-feedback">El balance es requerido.</div>
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <button type="button" class="btn btn-light me-2" routerLink="/accounts">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            Crear Cuenta
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
