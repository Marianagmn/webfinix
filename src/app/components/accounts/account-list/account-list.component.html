<div class="container-fluid py-2">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold m-0">Mis Cuentas</h2>
    <button class="btn btn-primary" routerLink="/accounts/create">
      <i class="bi bi-plus-circle me-1"></i> Nueva Cuenta
    </button>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div *ngIf="isLoading" class="text-center p-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <div *ngIf="!isLoading && accounts.length === 0" class="text-center p-5 text-muted">
        <i class="bi bi-inbox fs-1"></i>
        <p class="mt-2">No tienes cuentas registradas.</p>
      </div>

      <div class="table-responsive" *ngIf="!isLoading && accounts.length > 0">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Moneda</th>
              <th>Balance</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let acc of accounts">
              <td class="fw-semibold">{{ acc.nombre }}</td>
              <td><span class="badge bg-secondary">{{ acc.tipo }}</span></td>
              <td>{{ acc.moneda }}</td>
              <td class="fw-bold" [ngClass]="{'text-danger': acc.balance < 0, 'text-success': acc.balance >= 0}">
                {{ acc.balance | currency:acc.moneda }}
              </td>
              <td>
                <span class="badge" [ngClass]="acc.isActive ? 'bg-success' : 'bg-danger'">
                  {{ acc.isActive ? 'Activa' : 'Inactiva' }}
                </span>
              </td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-primary me-2" [routerLink]="['/accounts', acc.id, 'edit']">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteAccount(acc.id)">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
