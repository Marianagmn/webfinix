<div class="business-list-container">
  <div class="header">
    <h1>Finanzas Empresariales</h1>
  </div>

  <div *ngIf="isLoading" class="loading">
    <p>Cargando transacciones...</p>
  </div>

  <div *ngIf="!isLoading && transactions.length === 0" class="empty-state">
    <p>No hay transacciones registradas</p>
  </div>

  <div *ngIf="!isLoading && transactions.length > 0" class="transactions-table">
    <table class="table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Descripción</th>
          <th>Monto</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let txn of transactions">
          <td>{{ txn.fecha | date: 'dd/MM/yyyy' }}</td>
          <td>{{ txn.descripcion }}</td>
          <td>{{ txn.monto | number: '1.2-2' }}</td>
          <td>
            <span [class]="'badge badge-' + txn.estado">
              {{ txn.estado }}
            </span>
          </td>
          <td>
            <a [routerLink]="['/business-finance', txn.id]" class="btn btn-sm btn-primary">
              Ver
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
