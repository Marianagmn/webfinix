<ng-template #reverseModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Revertir Asiento Contable</h4>
    <button type="button" class="btn-close" (click)="dismiss()"></button>
  </div>

  <form [formGroup]="form">
    <div class="modal-body">
      <div class="alert alert-warning">
        <strong>Advertencia:</strong> Al revertir este asiento, se desharán todos sus cambios y se
        creará un registro inverso en los libros contables.
      </div>

      <div class="form-group">
        <label for="motivo">Motivo de la reversión <span class="text-danger">*</span></label>
        <textarea
          id="motivo"
          formControlName="motivo"
          class="form-control"
          rows="3"
          placeholder="Explain why you're reversing this entry..."
          [class.is-invalid]="form.get('motivo')?.invalid && form.get('motivo')?.touched"
        ></textarea>
        <small class="form-text text-muted">Mínimo 10 caracteres</small>
        <div class="invalid-feedback" *ngIf="form.get('motivo')?.errors?.['required']">
          El motivo es requerido
        </div>
        <div class="invalid-feedback" *ngIf="form.get('motivo')?.errors?.['minlength']">
          El motivo debe tener al menos 10 caracteres
        </div>
      </div>

      <div class="form-group">
        <label for="referencia">Referencia (Opcional)</label>
        <input
          id="referencia"
          type="text"
          formControlName="referencia"
          class="form-control"
          placeholder="Nota o referencia adicional..."
        />
        <small class="form-text text-muted">Por ejemplo: Número de memo o ticket de soporte</small>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="dismiss()">Cancelar</button>
      <button
        type="submit"
        (click)="onSubmit()"
        [disabled]="isSaving()"
        class="btn btn-danger"
      >
        <span *ngIf="!isSaving()">Revertir Asiento</span>
        <span *ngIf="isSaving()">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Procesando...
        </span>
      </button>
    </div>
  </form>
</ng-template>
