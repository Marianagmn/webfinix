<div class="container-fluid py-2">
  <div class="d-flex align-items-center mb-4">
    <a routerLink="/business" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left"></i></a>
    <h2 class="fw-bold m-0 text-warning">Aprobaciones Pendientes</h2>
  </div>

  <div class="card shadow-sm border-0 border-warning border-top border-4">
    <div class="card-body p-0">
      <div *ngIf="isLoading" class="text-center p-5">
        <div class="spinner-border text-warning" role="status"></div>
      </div>

      <div *ngIf="!isLoading && approvals.length === 0" class="text-center p-5 text-muted">
        <i class="bi bi-check2-circle fs-1 text-success"></i>
        <p class="mt-2">No hay transacciones pendientes de aprobación.</p>
        <a routerLink="/business" class="btn btn-sm btn-outline-secondary mt-2">Volver al listado</a>
      </div>

      <div class="table-responsive" *ngIf="!isLoading && approvals.length > 0">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>ID/Cliente</th>
              <th>Tipo</th>
              <th>Monto</th>
              <th>Vencimiento</th>
              <th class="text-end">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let txn of approvals">
              <td class="fw-semibold">
                {{ txn.clienteId }}
                <div class="small text-muted">ID: {{ txn.id }}</div>
              </td>
              <td><span class="badge bg-secondary">{{ txn.tipo }}</span></td>
              <td class="fw-bold text-dark">${{ txn.monto }}</td>
              <td>{{ txn.fechaVencimiento | date:'shortDate' }}</td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-success me-2" (click)="approve(txn.id)">
                  <i class="bi bi-check-lg me-1"></i> Aprobar
                </button>
                <button class="btn btn-sm btn-danger" (click)="reject(txn.id)">
                  <i class="bi bi-x-lg me-1"></i> Rechazar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
