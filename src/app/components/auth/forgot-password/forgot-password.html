<div class="forgot-password-container">
  <div class="card">
    @if (!isResetMode()) {
      <h2>Recuperar Contraseña</h2>
      <p class="subtitle">Ingresa tu email para recibir instrucciones de recuperación</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="form-control"
            [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
            placeholder="tu@email.com"
          />
          <div class="invalid-feedback" *ngIf="form.get('email')?.errors?.['required']">
            El email es requerido
          </div>
          <div class="invalid-feedback" *ngIf="form.get('email')?.errors?.['email']">
            Email inválido
          </div>
        </div>

        <button
          type="submit"
          [disabled]="isLoading()"
          class="btn btn-primary w-100"
        >
          <span *ngIf="!isLoading()">Enviar Instrucciones</span>
          <span *ngIf="isLoading()">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Enviando...
          </span>
        </button>
      </form>
    } @else {
      <h2>Restablecer Contraseña</h2>
      <p class="subtitle">Ingresa tu nueva contraseña</p>

      <form [formGroup]="resetForm" (ngSubmit)="onResetSubmit()">
        <div class="form-group">
          <label for="password">Nueva Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="form-control"
            [class.is-invalid]="resetForm.get('password')?.invalid && resetForm.get('password')?.touched"
            placeholder="Mínimo 8 caracteres"
          />
          <div class="invalid-feedback" *ngIf="resetForm.get('password')?.errors?.['required']">
            La contraseña es requerida
          </div>
          <div class="invalid-feedback" *ngIf="resetForm.get('password')?.errors?.['minlength']">
            Mínimo 8 caracteres
          </div>
        </div>

        <div class="form-group">
          <label for="passwordConfirm">Confirmar Contraseña</label>
          <input
            id="passwordConfirm"
            type="password"
            formControlName="passwordConfirm"
            class="form-control"
            [class.is-invalid]="resetForm.get('passwordConfirm')?.invalid && resetForm.get('passwordConfirm')?.touched"
            placeholder="Repite tu contraseña"
          />
          <div class="invalid-feedback" *ngIf="resetForm.get('passwordConfirm')?.errors?.['required']">
            Confirma tu contraseña
          </div>
        </div>

        <button
          type="submit"
          [disabled]="isLoading()"
          class="btn btn-primary w-100"
        >
          <span *ngIf="!isLoading()">Restablecer Contraseña</span>
          <span *ngIf="isLoading()">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Restableciendo...
          </span>
        </button>
      </form>
    }

    <div class="back-link">
      <button (click)="goToLogin()" class="btn btn-link">
        ← Volver al Login
      </button>
    </div>
  </div>
</div>
