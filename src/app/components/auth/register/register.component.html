<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-sm" style="width: 100%; max-width: 450px;">
    <h2 class="text-center mb-4 text-primary fw-bold">Crear Cuenta</h2>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre Completo</label>
        <input type="text" id="name" class="form-control" formControlName="name" placeholder="Tu nombre"
               [ngClass]="{'is-invalid': registerForm.get('name')?.invalid && registerForm.get('name')?.touched}">
        <div class="invalid-feedback" *ngIf="registerForm.get('name')?.hasError('required')">El nombre es requerido.</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" formControlName="email" placeholder="nombre@ejemplo.com"
               [ngClass]="{'is-invalid': registerForm.get('email')?.invalid && registerForm.get('email')?.touched}">
        <div class="invalid-feedback" *ngIf="registerForm.get('email')?.hasError('required')">El correo es requerido.</div>
        <div class="invalid-feedback" *ngIf="registerForm.get('email')?.hasError('email')">Debe ser un correo válido.</div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" formControlName="password" placeholder="Mínimo 8 caracteres"
               [ngClass]="{'is-invalid': registerForm.get('password')?.invalid && registerForm.get('password')?.touched}">
        <div class="invalid-feedback" *ngIf="registerForm.get('password')?.hasError('required')">La contraseña es requerida.</div>
        <div class="invalid-feedback" *ngIf="registerForm.get('password')?.hasError('minlength')">Debe tener al menos 8 caracteres.</div>
      </div>

      <div class="mb-3">
        <label for="passwordConfirm" class="form-label">Confirmar Contraseña</label>
        <input type="password" id="passwordConfirm" class="form-control" formControlName="passwordConfirm" placeholder="Confirma tu contraseña"
               [ngClass]="{'is-invalid': (registerForm.get('passwordConfirm')?.invalid || registerForm.hasError('mismatch')) && registerForm.get('passwordConfirm')?.touched}">
        <div class="invalid-feedback" *ngIf="registerForm.hasError('mismatch') && registerForm.get('passwordConfirm')?.touched">Las contraseñas no coinciden.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isLoading ? 'Registrando...' : 'Registrarse' }}
      </button>

      <div class="text-center mt-3">
        <small class="text-muted">¿Ya tienes cuenta? <a routerLink="/login" class="text-primary text-decoration-none">Inicia Sesión</a></small>
      </div>
    </form>
  </div>
</div>
