<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4 text-primary fw-bold">Finix Login</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" formControlName="email" placeholder="nombre@ejemplo.com"
               [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
        <div class="invalid-feedback" *ngIf="loginForm.get('email')?.hasError('required')">El correo es requerido.</div>
        <div class="invalid-feedback" *ngIf="loginForm.get('email')?.hasError('email')">Debe ser un correo válido.</div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" formControlName="password" placeholder="********"
               [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
        <div class="invalid-feedback" *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es requerida.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isLoading ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>

      <div class="text-center mt-3">
        <small class="text-muted">¿No tienes cuenta? <a routerLink="/register" class="text-primary text-decoration-none">Regístrate</a></small>
      </div>
    </form>
  </div>
</div>
